<canvas id="lexiRain" style="position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:0.24;"></canvas>
<script>
const STUDIO_URL = "https://github.io";
const MODS = {
  m1: { name: "Module 01: Legal & Tax Document AI Assistant", url: "https://streamlit.app" },
  m2: { name: "Module 02: Tax-Trap Contract Scanner", url: "https://streamlit.app" },
  m3: { name: "Module 03: Worst-Case Life Event Simulator", url: "https://streamlit.app" },
  m4: { name: "Module 04: LexiTech Pro Cloud Workspace", url: "https://streamlit.app" }
};

const backEl = document.getElementById("studioBackLink");
if (backEl) backEl.href = STUDIO_URL;

let wakeMode = false;
let rec = null;
let audioObj = null;
let historyList = Array.of();

function setHolo(state, label) {
  const w = document.getElementById("holoWrap");
  if (!w) return;
  w.classList.remove("listening", "speaking");
  if (state) w.classList.add(state);
  const tag = document.getElementById("coreState");
  if (tag) tag.textContent = "LEXI // " + label;
}

function addMsg(who, text, url, label) {
  const log = document.getElementById("chatLog");
  if (!log) return;
  const d = document.createElement("div");
  d.className = who === "LEXI" ? "msg msg-lexi" : "msg msg-user";
  d.innerHTML = "<strong>" + who + ":</strong> " + text;
  if (url) {
    const a = document.createElement("a");
    a.className = "launch-link";
    a.href = url;
    a.target = "_blank";
    a.rel = "noopener";
    a.textContent = "Launch " + label + " →";
    d.appendChild(document.createElement("br"));
    d.appendChild(a);
  }
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}

function stopSpeech() {
  if (audioObj) { audioObj.pause(); audioObj = null; }
  if ("speechSynthesis" in window) window.speechSynthesis.cancel();
  setHolo("", "STANDBY");
}

async function speak(text) {
  stopSpeech();
  const eKey = localStorage.getItem("lexi_eleven_key");
  const eVoice = localStorage.getItem("lexi_eleven_voice") || "EXAVITQu4vr4xnSDxMaL";
  if (eKey) {
    try {
      setHolo("speaking", "SPEAKING");
      const r = await fetch("https://elevenlabs.io" + eVoice, {
        method: "POST",
        headers: { "xi-api-key": eKey, "Content-Type": "application/json" },
        body: JSON.stringify({ text: text, model_id: "eleven_turbo_v2_5", voice_settings: { stability: 0.45, similarity_boost: 0.8 } })
      });
      if (r.ok) {
        const b = await r.blob();
        audioObj = new Audio(URL.createObjectURL(b));
        audioObj.onended = () => { setHolo("", "STANDBY"); if (wakeMode) startListening(true); };
        await audioObj.play();
        return;
      }
    } catch (e) {}
  }
  if (!("speechSynthesis" in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  const vs = window.speechSynthesis.getVoices().filter(v => v.lang && v.lang.startsWith("en"));
  const pick = Array.of("Karen", "Zoe", "Ava", "Nicky", "Samantha").map(n => vs.find(v => v.name.includes(n))).find(Boolean);
  if (pick) u.voice = pick;
  u.rate = 0.92;
  u.pitch = 1.08;
  u.onstart = () => setHolo("speaking", "SPEAKING");
  u.onend = () => { setHolo("", "STANDBY"); if (wakeMode) startListening(true); };
  window.speechSynthesis.speak(u);
}

function testVoice() {
  speak("Hi, I'm Lexi, your AI assistant. Ask any question—I'm here to help.");
}

function toggleKeyDrawer() {
  const dr = document.getElementById("keyDrawer");
  if (!dr) return;
  dr.classList.toggle("open");
  document.getElementById("apiKeyInput").value = localStorage.getItem("lexi_gemini_key") || "";
  document.getElementById("elevenKeyInput").value = localStorage.getItem("lexi_eleven_key") || "";
}

function saveKeys() {
  const g = document.getElementById("apiKeyInput").value.trim();
  const e = document.getElementById("elevenKeyInput").value.trim();
  const v = document.getElementById("elevenVoiceSelect").value;
  if (g) localStorage.setItem("lexi_gemini_key", g); else localStorage.removeItem("lexi_gemini_key");
  if (e) localStorage.setItem("lexi_eleven_key", e); else localStorage.removeItem("lexi_eleven_key");
  localStorage.setItem("lexi_eleven_voice", v);
  document.getElementById("keyDrawer").classList.remove("open");
  const m = "Settings saved. I'm ready whenever you are.";
  addMsg("LEXI", m);
  speak(m);
}
function matchModule(q) {
  const s = q.toLowerCase();
  if (!/(open|launch|start|go|take|show|module)/.test(s)) return null;
  if (/(tax|trap|scanner|8332|02|module 2|module two)/.test(s)) return MODS.m2;
  if (/(life|event|simulator|crisis|layoff|03|module 3|module three)/.test(s)) return MODS.m3;
  if (/(workplace|workspace|vault|cloud|login|04|module 4|module four)/.test(s)) return MODS.m4;
  if (/(assistant|document|audit|01|module 1|module one)/.test(s)) return MODS.m1;
  return null;
}

function localBrain(q) {
  const s = q.toLowerCase();
  if (/^(hi|hello|hey|yo|sup)/.test(s)) return { text: "Hey! Ask me how any of our four AI engines work, ask a tax or contract question, or tell me which module to open." };
  if (/(4 engines|four engines|what can|explain|modules)/.test(s)) return { text: "LexiTech has four AI engines: Module 01 audits contracts and IRS manuals with page citations; Module 02 detects tax traps like Form 8332 and 1099 issues; Module 03 simulates emergencies against contracts; and Module 04 is your Pro Cloud Workspace.", url: MODS.m4.url, label: "Pro Cloud Workspace" };
  if (/(8332|divorce|child|dependent)/.test(s)) return { text: "A divorce decree alone does not override IRS dependency rules—Form 8332 must be signed by the custodial parent. Module 02 scans agreements for Form 8332 collisions.", url: MODS.m2.url, label: "Tax-Trap Scanner" };
  if (/(1099|contractor|w-2|w2)/.test(s)) return { text: "Misclassifying an employee as a 1099 contractor triggers back payroll taxes and penalties. Module 02 flags worker-classification traps in contracts.", url: MODS.m2.url, label: "Tax-Trap Scanner" };
  if (/(layoff|disability|medical|emergency|crisis)/.test(s)) return { text: "Module 03 simulates sudden layoffs, medical emergencies, or partner defaults against your contracts and drafts protective escape riders.", url: MODS.m3.url, label: "Life Event Simulator" };
  return { text: "I can explain any of your four LexiTech engines, answer tax and contract questions, or open any module for you. Tap AI & Voice Keys at the top right to link your Gemini key for full open-ended AI answers." };
}

async function processQuery(raw) {
  const text = (raw || "").trim();
  if (!text) return;
  addMsg("YOU", text);

  const mod = matchModule(text);
  if (mod) {
    const r = "Opening " + mod.name + " now. Tap the button below if your browser blocks popups.";
    addMsg("LEXI", r, mod.url, mod.name);
    speak(r);
    window.open(mod.url, "_blank", "noopener");
    return;
  }

  const gKey = localStorage.getItem("lexi_gemini_key");
  if (!gKey) {
    const ans = localBrain(text);
    addMsg("LEXI", ans.text, ans.url, ans.label);
    speak(ans.text);
    return;
  }

  document.getElementById("statusText").textContent = "THINKING...";
  historyList.push({ role: "user", parts: Array.of({ text: text }) });
  try {
    const res = await fetch("https://googleapis.com" + encodeURIComponent(gKey), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        systemInstruction: { parts: Array.of({ text: "You are Lexi, the poised AI assistant for LexiTech Legal & Tax AI Studio created by Heidi Seckman. Answer concisely in 2-3 sentences." }) },
        contents: historyList
      })
    });
    const data = await res.json();
    const cand = data && data.candidates && data.candidates.at(0);
    const part = cand && cand.content && cand.content.parts && cand.content.parts.at(0);
    const reply = (part && part.text) || localBrain(text).text;
    historyList.push({ role: "model", parts: Array.of({ text: reply }) });
    document.getElementById("statusText").textContent = "READY";
    addMsg("LEXI", reply);
    speak(reply);
  } catch (err) {
    document.getElementById("statusText").textContent = "READY";
    const ans = localBrain(text);
    addMsg("LEXI", ans.text, ans.url, ans.label);
    speak(ans.text);
  }
}

const formEl = document.getElementById("chatForm");
if (formEl) {
  formEl.addEventListener("submit", function(e) {
    e.preventDefault();
    const inp = document.getElementById("userInput");
    const v = inp.value;
    inp.value = "";
    processQuery(v);
  });
}

function startListening(passive) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    document.getElementById("statusText").textContent = "VOICE NOT SUPPORTED HERE — TYPE BELOW";
    return;
  }
  if (rec) { try { rec.abort(); } catch (e) {} }
  rec = new SR();
  rec.lang = "en-US";
  rec.onstart = () => { setHolo("listening", passive ? "WAKE" : "LISTENING"); };
  rec.onresult = (ev) => {
    const res = ev.results && ev.results.item(0);
    const alt = res && res.item(0);
    const t = alt ? alt.transcript : "";
    if (!t) return;
    if (passive) {
      if (/lexi/i.test(t)) processQuery(t.replace(/hey\s*lexi[, ]*/i, "").trim() || "Hi Lexi");
      else if (wakeMode) startListening(true);
    } else {
      processQuery(t);
    }
  };
  rec.onerror = () => setHolo("", "STANDBY");
  rec.onend = () => { if (!document.getElementById("holoWrap").classList.contains("speaking")) setHolo("", "STANDBY"); };
  rec.start();
}

function toggleWakeMode() {
  wakeMode = !wakeMode;
  document.getElementById("wakeBtn").textContent = "👂 Wake Word: " + (wakeMode ? "ON" : "OFF");
  if (wakeMode) startListening(true);
  else if (rec) rec.abort();
}

(() => {
  const rc = document.getElementById("lexiRain");
  if (!rc) return;
  const rctx = rc.getContext("2d");
  const chars = "01アイウエオカキクケコLEXI§10998332";
  let cols, drops;
  function resizeRain() {
    rc.width = window.innerWidth;
    rc.height = window.innerHeight;
    cols = Math.floor(rc.width / 18);
    drops = Array(cols).fill(1).map(() => Math.random() * -40);
  }
  resizeRain();
  window.addEventListener("resize", resizeRain);
  setInterval(() => {
    rctx.fillStyle = "rgba(7, 2, 5, 0.14)";
    rctx.fillRect(0, 0, rc.width, rc.height);
    rctx.font = '13px "JetBrains Mono", monospace';
    for (let i = 0; i < drops.length; i++) {
      const ch = chars.charAt(Math.floor(Math.random() * chars.length));
      rctx.fillStyle = Math.random() > 0.85 ? "#F9A8D4" : "#FF2A85";
      rctx.fillText(ch, i * 18, drops.at(i) * 18);
      if (drops.at(i) * 18 > rc.height && Math.random() > 0.975) drops.splice(i, 1, 0);
      else drops.splice(i, 1, drops.at(i) + 0.55);
    }
  }, 55);
})();
</script>
</body>
</html>
