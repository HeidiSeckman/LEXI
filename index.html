<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LEXI // LexiTech AI Assistant</title>
<link href="https://googleapis.com" rel="stylesheet" />
<style>
 :root { --card:rgba(30,12,24,0.88); --pink:#FF2A85; --rose:#F9A8D4; --cyan:#38BDF8; --border:rgba(255,42,133,0.38); --text:#FFF5FA; --muted:#E5C1D3; }
 * { box-sizing:border-box; margin:0; padding:0; }
 body {
   background:radial-gradient(circle at 50% 24%, #2E0E22 0%, #12050D 58%, #070205 100%);
   color:var(--text);
   font-family:'Plus Jakarta Sans',sans-serif;
   min-height:100vh;
   display:flex;
   flex-direction:column;
   align-items:center;
   padding:22px 18px 40px;
 }
 .topbar { width:100%; max-width:960px; display:flex; justify-content:space-between; align-items:center; background:var(--card); border:1px solid var(--border); border-radius:16px; padding:12px 20px; margin-bottom:24px; flex-wrap:wrap; gap:10px; }
 .brand { font-weight:800; font-size:21px; letter-spacing:1px; }
 .brand span { color:var(--pink); }
 .pill { font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700; color:var(--rose); border:1px solid var(--border); background:rgba(255,42,133,0.12); padding:6px 14px; border-radius:999px; text-decoration:none; cursor:pointer; }
 .core-stage { width:100%; max-width:960px; background:var(--card); border:1.5px solid var(--border); border-radius:24px; padding:26px 24px 30px; display:flex; flex-direction:column; align-items:center; text-align:center; box-shadow:0 0 50px rgba(255,42,133,0.18); }
 .holo-stage { position:relative; width:270px; height:330px; display:flex; flex-direction:column; align-items:center; justify-content:center; margin:6px 0 8px; cursor:pointer; }
 .holo-avatar {
   width:255px;
   height:315px;
   object-fit:contain;
   mix-blend-mode:screen;
   animation:holoFloat 4.2s ease-in-out infinite, holoFlicker 7s infinite;
   filter:drop-shadow(0 0 18px rgba(255,42,133,0.65));
   transition:filter 0.3s ease, transform 0.3s ease;
   pointer-events:none;
 }
 .listening .holo-avatar {
   filter:hue-rotate(155deg) saturate(1.4) drop-shadow(0 0 26px rgba(56,189,248,0.95));
 }
 .speaking .holo-avatar {
   animation:holoSpeak 0.42s ease-in-out infinite alternate;
   filter:brightness(1.12) saturate(1.25) drop-shadow(0 0 32px rgba(255,42,133,1));
 }
 @keyframes holoFloat { 0%, 100% { transform:translateY(0px); } 50% { transform:translateY(-8px); } }
 @keyframes holoSpeak { from { transform:translateY(-3px) scale(1.0); } to { transform:translateY(-7px) scale(1.028); } }
 @keyframes holoFlicker { 0%, 96%, 100% { opacity:0.98; } 97% { opacity:0.84; } 98% { opacity:0.99; } 99% { opacity:0.88; } }
 .holo-tag { font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:700; letter-spacing:1.5px; color:#FFF; background:rgba(255,42,133,0.22); border:1px solid var(--pink); padding:4px 14px; border-radius:999px; margin-top:-6px; }
 .status-bar { font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--rose); margin:10px 0 16px; letter-spacing:0.5px; }
 .controls { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; align-items:center; margin-bottom:14px; }
 .voice-bar { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; align-items:center; margin-bottom:18px; font-size:12px; color:var(--muted); }
 .voice-select { background:rgba(255,255,255,0.08); border:1px solid var(--border); color:#FFF5FA; border-radius:999px; padding:6px 14px; font-size:12px; font-family:'JetBrains Mono',monospace; outline:none; max-width:240px; }
 .btn { background:linear-gradient(135deg,#E11D74 0%,#88134D 100%); color:#FFF; font-weight:700; font-size:13.5px; padding:11px 22px; border-radius:999px; border:1px solid #F9A8D4; cursor:pointer; box-shadow:0 6px 20px rgba(225,29,116,0.35); }
 .btn-ghost { background:transparent; border:1.5px solid var(--rose); color:var(--rose); box-shadow:none; }
 .chat-box { width:100%; max-width:760px; background:rgba(12,4,9,0.75); border:1px solid var(--border); border-radius:16px; padding:16px; text-align:left; max-height:240px; overflow-y:auto; margin-bottom:14px; display:flex; flex-direction:column; gap:10px; }
 .msg { font-size:13.8px; line-height:1.55; padding:10px 14px; border-radius:12px; }
 .msg-lexi { background:rgba(255,42,133,0.14); border-left:3px solid var(--pink); color:#FFF5FA; }
 .msg-user { background:rgba(255,255,255,0.07); border-right:3px solid var(--rose); color:#E5C1D3; align-self:flex-end; }
 .input-row { width:100%; max-width:760px; display:flex; gap:10px; }
 .txt-in { flex:1; background:rgba(255,255,255,0.08); border:1.5px solid var(--border); color:#FFF; border-radius:999px; padding:12px 18px; font-size:14px; font-family:inherit; outline:none; }
 .key-drawer { width:100%; max-width:760px; margin-top:16px; padding:14px 18px; background:rgba(255,42,133,0.08); border:1px dashed var(--border); border-radius:14px; display:none; gap:10px; flex-wrap:wrap; align-items:center; justify-content:space-between; }
 .key-drawer.open { display:flex; }
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">LEXI<span> // HOLOGRAPHIC AI</span></div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;">
    <button type="button" class="pill" onclick="toggleKeyDrawer()">⚙ GEMINI NEURAL KEY</button>
    <a class="pill" href="https://github.io">← BACK TO STUDIO</a>
  </div>
</div>

<div class="core-stage">
  <div class="pill">LEXITECH AI ASSISTANT // ENGINEERED BY HEIDI SECKMAN</div>
  <div class="holo-stage" id="holoWrap" onclick="testVoice()" title="Click Lexi to hear her">
    <img class="holo-avatar" src="LEXI_avatar.png" alt="LEXI Hologram" />
    <div class="holo-tag" id="coreState">LEXI // STANDBY</div>
  </div>
  <div class="status-bar" id="statusText">READY — CLICK "TALK TO LEXI" OR TYPE BELOW</div>

  <div class="controls">
    <button type="button" class="btn" id="micBtn" onclick="startListening()">🎙 Talk to Lexi</button>
    <button type="button" class="btn btn-ghost" id="wakeBtn" onclick="toggleWakeMode()">👂 Wake Word ("Hey Lexi"): OFF</button>
    <button type="button" class="btn btn-ghost" onclick="stopSpeech()">⏹ Mute Voice</button>
  </div>

  <div class="voice-bar">
    <label for="voiceSelect">Voice:</label>
    <select id="voiceSelect" class="voice-select" onchange="testVoice()"></select>
    <label for="rateSelect">Pace:</label>
    <select id="rateSelect" class="voice-select" onchange="testVoice()">
      <option value="0.82">Calm &amp; Poised (0.82x)</option>
      <option value="0.90" selected>Natural &amp; Clear (0.90x)</option>
      <option value="0.98">Conversational (0.98x)</option>
    </select>
  </div>

  <div class="chat-box" id="chatLog">
    <div class="msg msg-lexi"><strong>LEXI:</strong> Hi, I'm Lexi, your AI assistant. Ask any question—I'm here to help.</div>
  </div>

  <form class="input-row" id="chatForm">
    <input class="txt-in" id="userInput" type="text" placeholder="Ask any question..." autocomplete="off" />
    <button type="submit" id="sendBtn" class="btn">Send →</button>
  </form>

  <div class="key-drawer" id="keyDrawer">
    <span style="font-size:12.5px;color:#F9A8D4;">Optional Gemini API Key (saved privately in your browser only):</span>
    <input class="txt-in" id="apiKeyInput" type="password" placeholder="AIzaSy..." style="min-width:220px;" />
    <button type="button" class="btn" onclick="saveKey()">Save Key</button>
  </div>
</div>
<script>
const MODULES = {
  assistant: { name: "Legal & Tax Document AI Assistant", url: "https://streamlit.app" },
  tax: { name: "Tax-Trap Contract Scanner", url: "https://streamlit.app" },
  life: { name: "Worst-Case Life Event Simulator", url: "https://streamlit.app" },
  workplace: { name: "LexiTech Pro Cloud Workspace", url: "https://streamlit.app" }
};

let wakeMode = false;
let recognition = null;
let allVoices = [];

function populateVoices() {
  if (!('speechSynthesis' in window)) return;
  allVoices = window.speechSynthesis.getVoices().filter(v => v.lang && v.lang.startsWith('en'));
  const sel = document.getElementById('voiceSelect');
  if (!sel || !allVoices.length) return;
  const preferredOrder = Array.of('Karen', 'Zoe', 'Nicky', 'Ava', 'Allison', 'Samantha', 'Victoria', 'Google UK English Female');
  allVoices.sort((a, b) => {
    const ia = preferredOrder.findIndex(p => a.name.includes(p));
    const ib = preferredOrder.findIndex(p => b.name.includes(p));
    return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
  });
  sel.innerHTML = allVoices.map((v, i) => `<option value="${i}">${v.name}</option>`).join('');
}

if ('speechSynthesis' in window) {
  populateVoices();
  window.speechSynthesis.onvoiceschanged = populateVoices;
}

function setVisualState(state, label) {
  const wrap = document.getElementById('holoWrap');
  wrap.classList.remove('listening', 'speaking');
  if (state) wrap.classList.add(state);
  document.getElementById('coreState').textContent = 'LEXI // ' + label;
}

function addMessage(sender, text) {
  const log = document.getElementById('chatLog');
  const div = document.createElement('div');
  div.className = sender === 'LEXI' ? 'msg msg-lexi' : 'msg msg-user';
  div.innerHTML = `<strong>${sender}:</strong> ${text}`;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  const sel = document.getElementById('voiceSelect');
  const rateSel = document.getElementById('rateSelect');
  const chosenVoice = sel && allVoices.at(Number(sel.value));
  if (chosenVoice) utter.voice = chosenVoice;
  utter.rate = rateSel ? parseFloat(rateSel.value) : 0.90;
  utter.pitch = 1.16;
  utter.onstart = () => setVisualState('speaking', 'SPEAKING');
  utter.onend = () => {
    setVisualState('', 'STANDBY');
    if (wakeMode) startListening(true);
  };
  window.speechSynthesis.speak(utter);
}

function testVoice() {
  speak("Hi, I'm Lexi, your AI assistant. Ask any question—I'm here to help.");
}

function stopSpeech() {
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  setVisualState('', 'STANDBY');
}

function toggleKeyDrawer() {
  document.getElementById('keyDrawer').classList.toggle('open');
  document.getElementById('apiKeyInput').value = localStorage.getItem('lexi_gemini_key') || '';
}

function saveKey() {
  const val = document.getElementById('apiKeyInput').value.trim();
  if (val) localStorage.setItem('lexi_gemini_key', val);
  else localStorage.removeItem('lexi_gemini_key');
  document.getElementById('keyDrawer').classList.remove('open');
  const msg = val ? "Got it. My Gemini key is saved and I'm ready to help." : "Key cleared. I'm still ready to help with your studio tools.";
  addMessage('LEXI', msg);
  speak(msg);
}

function checkStudioCommand(q) {
  const s = q.toLowerCase();
  if (/(open|launch|start).*(tax|trap|scanner|module 2|module two)/.test(s)) return MODULES.tax;
  if (/(open|launch|start).*(life|event|simulator|crisis|module 3|module three)/.test(s)) return MODULES.life;
  if (/(open|launch|start).*(workplace|workspace|vault|cloud|login|module 4|module four)/.test(s)) return MODULES.workplace;
  if (/(open|launch|start).*(assistant|document|audit|module 1|module one)/.test(s)) return MODULES.assistant;
  return null;
}

async function processQuery(rawText) {
  const text = rawText.trim();
  if (!text) return;
  addMessage('YOU', text);

  const cmd = checkStudioCommand(text);
  if (cmd) {
    const reply = `Sure thing—opening ${cmd.name} for you now.`;
    addMessage('LEXI', reply);
    speak(reply);
    window.open(cmd.url, '_blank', 'noopener');
    return;
  }

  const apiKey = localStorage.getItem('lexi_gemini_key');
  if (!apiKey) {
    const fallback = "Hi, I'm Lexi, your AI assistant. Ask me to open any of your four LexiTech tools—like the Tax-Trap Scanner, Life Event Simulator, or Cloud Workspace—or add your Gemini key at the top right so I can answer any question in full.";
    addMessage('LEXI', fallback);
    speak(fallback);
    return;
  }

  document.getElementById('statusText').textContent = 'THINKING...';
  try {
    const payload = {
      systemInstruction: { parts: Array.of({ text: "You are Lexi, a poised, warm, and intelligent AI assistant for LexiTech Legal & Tax AI Studio, created by Heidi Seckman. Speak naturally, clearly, and concisely (2-3 sentences) so your answers sound great spoken aloud." }) },
      contents: Array.of({ role: 'user', parts: Array.of({ text }) })
    };
    const res = await fetch(`https://googleapis.com{encodeURIComponent(apiKey)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    const firstCand = data && data.candidates && data.candidates.at(0);
    const firstPart = firstCand && firstCand.content && firstCand.content.parts && firstCand.content.parts.at(0);
    const reply = (firstPart && firstPart.text) || (data && data.error && data.error.message) || "I had trouble connecting. Please check your Gemini API key.";
    document.getElementById('statusText').textContent = 'READY';
    addMessage('LEXI', reply);
    speak(reply);
  } catch (err) {
    document.getElementById('statusText').textContent = 'CONNECTION ERROR';
    const errMsg = "I couldn't reach the server right now. Please check your internet connection or API key.";
    addMessage('LEXI', errMsg);
    speak(errMsg);
  }
}

document.getElementById('chatForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const inp = document.getElementById('userInput');
  const val = inp.value;
  inp.value = '';
  processQuery(val);
});

function startListening(passive = false) {
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRec) {
    document.getElementById('statusText').textContent = 'VOICE INPUT NOT SUPPORTED HERE — TYPE BELOW';
    return;
  }
  if (recognition) { try { recognition.abort(); } catch (e) {} }
  recognition = new SpeechRec();
  recognition.lang = 'en-US';
  recognition.interimResults = false;
  recognition.onstart = () => {
    setVisualState('listening', passive ? 'WAKE LISTENING' : 'LISTENING');
    document.getElementById('statusText').textContent = passive ? 'SAY "HEY LEXI..."' : 'LISTENING...';
  };
  recognition.onresult = (event) => {
    const firstResult = event.results && event.results.item(0);
    const firstAlt = firstResult && firstResult.item(0);
    const transcript = firstAlt ? firstAlt.transcript : '';
    if (!transcript) return;
    if (passive) {
      if (/lexi/i.test(transcript)) {
        const cleaned = transcript.replace(/hey\s*lexi[, ]*/i, '').trim() || "Hi, I'm listening. How can I help?";
        processQuery(cleaned);
      } else if (wakeMode) {
        startListening(true);
      }
    } else {
      processQuery(transcript);
    }
  };
  recognition.onerror = () => {
    setVisualState('', 'STANDBY');
    document.getElementById('statusText').textContent = 'READY';
  };
  recognition.onend = () => {
    if (!document.getElementById('holoWrap').classList.contains('speaking')) {
      setVisualState('', 'STANDBY');
    }
  };
  recognition.start();
}

function toggleWakeMode() {
  wakeMode = !wakeMode;
  document.getElementById('wakeBtn').textContent = `👂 Wake Word ("Hey Lexi"): ${wakeMode ? 'ON' : 'OFF'}`;
  if (wakeMode) startListening(true);
  else if (recognition) recognition.abort();
}
</script>
 <canvas id="lexiRain" style="position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:0.24;"></canvas>
<script>
(() => {
 const rc = document.getElementById('lexiRain'), rctx = rc.getContext('2d');
 const chars = '01アイウエオカキクケコLEXI§10998332';
 let cols, drops;
 function resizeRain() {
   rc.width = window.innerWidth;
   rc.height = window.innerHeight;
   cols = Math.floor(rc.width / 18);
   drops = Array(cols).fill(1).map(() => Math.random() * -40);
 }
 resizeRain();
 window.addEventListener('resize', resizeRain);
 setInterval(() => {
   rctx.fillStyle = 'rgba(7, 2, 5, 0.14)';
   rctx.fillRect(0, 0, rc.width, rc.height);
   rctx.font = '13px "JetBrains Mono", monospace';
   for (let i = 0; i < drops.length; i++) {
     const ch = chars[Math.floor(Math.random() * chars.length)];
     rctx.fillStyle = Math.random() > 0.85 ? '#F9A8D4' : '#FF2A85';
     rctx.fillText(ch, i * 18, drops[i] * 18);
     if (drops[i] * 18 > rc.height && Math.random() > 0.975) drops[i] = 0;
     drops[i] += 0.55;
   }
 }, 55);
})();
</script>
</body>
</html>
