<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEXI // AI Assistant</title>
<style>
  body { margin:0; background:#0b0308; color:#fff5fa; font-family:-apple-system,BlinkMacSystemFont,sans-serif; display:flex; flex-direction:column; align-items:center; padding:20px 14px; }
  .box { width:100%; max-width:720px; background:#1c0a15; border:1px solid #ff2a85; border-radius:20px; padding:20px; text-align:center; }
  .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; gap:8px; flex-wrap:wrap; }
  .pill { background:#2d1122; color:#f9a8d4; border:1px solid #ff2a85; border-radius:99px; padding:6px 14px; font-size:12px; font-weight:700; text-decoration:none; cursor:pointer; }
  .avatar { width:210px; height:250px; object-fit:contain; mix-blend-mode:screen; margin:6px auto; display:block; }
  .speaking .avatar { filter:drop-shadow(0 0 24px #ff2a85); transform:scale(1.03); }
  .listening .avatar { filter:hue-rotate(155deg) drop-shadow(0 0 24px #38bdf8); }
  .btn { background:#e11d74; color:#fff; border:1px solid #f9a8d4; border-radius:99px; padding:10px 18px; font-weight:700; font-size:14px; cursor:pointer; margin:4px; }
  .chat { background:#090206; border:1px solid #4a1834; border-radius:14px; padding:12px; height:230px; overflow-y:auto; text-align:left; margin:14px 0; display:flex; flex-direction:column; gap:8px; }
  .m-ai { background:#280e1d; border-left:3px solid #ff2a85; padding:8px 12px; border-radius:10px; font-size:14px; }
  .m-me { background:#1f1f24; border-right:3px solid #f9a8d4; padding:8px 12px; border-radius:10px; font-size:14px; align-self:flex-end; }
  .row { display:flex; gap:8px; }
  input { flex:1; background:#14070f; border:1px solid #ff2a85; color:#fff; border-radius:99px; padding:10px 16px; font-size:14px; outline:none; }
  .keys { display:none; flex-direction:column; gap:8px; margin-top:12px; padding-top:12px; border-top:1px dashed #ff2a85; }
  .keys.show { display:flex; }
</style>
</head>
<body>
<div class="box" id="stage">
  <div class="top">
    <strong style="font-size:18px;">LEXI <span style="color:#ff2a85;">// AI</span></strong>
    <div>
      <button type="button" class="pill" onclick="toggleKeys()">⚙ API Keys</button>
      <a class="pill" href="https://github.io">← Studio</a>
    </div>
  </div>

  <img class="avatar" src="LEXI_avatar.png" alt="LEXI" onclick="say('Hi, I am Lexi. What are we working on?')">
  <div id="stat" style="font-size:12px;color:#f9a8d4;margin-bottom:8px;">READY</div>

  <div>
    <button type="button" class="btn" onclick="listen()">🎙 Talk to Lexi</button>
    <button type="button" class="btn" style="background:transparent;" onclick="stopAll()">⏹ Stop</button>
  </div>

  <div class="chat" id="log">
    <div class="m-ai"><strong>LEXI:</strong> Hi, I'm Lexi. Tap Talk to Lexi for a hands-free chat, or type below.</div>
  </div>

  <div class="row">
    <input id="inp" type="text" placeholder="Message Lexi..." onkeydown="if(event.key==='Enter')send()">
    <button type="button" class="btn" onclick="send()">Send</button>
  </div>

  <div class="keys" id="kbox">
    <input id="gk" type="password" placeholder="Gemini API Key (AIzaSy...)">
    <input id="ek" type="password" placeholder="ElevenLabs API Key (sk_...)">
    <button type="button" class="btn" onclick="saveKeys()">Save Keys</button>
  </div>
</div>

<script>
const VOICE_ID = "yM93hbw8Qtvdma2wCnJG";
const audio = new Audio();
let hist = [], loopMic = false, mic = null;

function add(who, txt) {
  const l = document.getElementById("log"), d = document.createElement("div");
  d.className = who === "LEXI" ? "m-ai" : "m-me";
  d.innerHTML = "<strong>" + who + ":</strong> " + txt;
  l.appendChild(d); l.scrollTop = l.scrollHeight;
}

function toggleKeys() {
  document.getElementById("kbox").classList.toggle("show");
  document.getElementById("gk").value = localStorage.getItem("lexi_gemini_key") || "";
  document.getElementById("ek").value = localStorage.getItem("lexi_eleven_key") || "";
}

function saveKeys() {
  localStorage.setItem("lexi_gemini_key", document.getElementById("gk").value.trim());
  localStorage.setItem("lexi_eleven_key", document.getElementById("ek").value.trim());
  document.getElementById("kbox").classList.remove("show");
  add("LEXI", "Keys saved."); say("Keys saved.");
}

function stopAll() {
  loopMic = false; audio.pause();
  if (mic) try { mic.abort(); } catch (e) {}
  document.getElementById("stage").className = "box";
  document.getElementById("stat").textContent = "PAUSED";
}

async function say(txt, nextMic) {
  audio.pause();
  const ek = localStorage.getItem("lexi_eleven_key");
  if (!ek) { if (nextMic && loopMic) listen(true); return; }
  document.getElementById("stage").className = "box speaking";
  try {
    const r = await fetch("https://elevenlabs.io" + VOICE_ID, {
      method: "POST",
      headers: { "xi-api-key": ek, "Content-Type": "application/json" },
      body: JSON.stringify({ text: txt, model_id: "eleven_multilingual_v2" })
    });
    if (r.ok) {
      audio.src = URL.createObjectURL(await r.blob());
      audio.onended = () => {
        document.getElementById("stage").className = "box";
        if (nextMic && loopMic) setTimeout(() => listen(true), 300);
      };
      await audio.play();
    } else { document.getElementById("stage").className = "box"; }
  } catch (e) { document.getElementById("stage").className = "box"; }
}

async function ask(q, voice) {
  if (!q) return;
  if (/^(stop|bye|goodbye)$/i.test(q)) { stopAll(); add("LEXI", "Stopped."); return; }
  add("YOU", q);
  const gk = localStorage.getItem("lexi_gemini_key");
  if (!gk) { add("LEXI", "Tap API Keys at the top right and paste your Gemini key first."); return; }
  document.getElementById("stat").textContent = "THINKING...";
  hist.push({ role: "user", parts: [{ text: q }] });
  if (hist.length > 24) hist = hist.slice(-24);
  try {
    const r = await fetch("https://googleapis.com" + encodeURIComponent(gk), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        systemInstruction: { parts: [{ text: "You are Lexi, a sharp, warm, witty conversational AI assistant created by Heidi Seckman. Talk naturally like a real person in 2 to 3 concise sentences without markdown symbols." }] },
        contents: hist
      })
    });
    const d = await r.json();
    const reply = (d.candidates && d.candidates[0] && d.candidates[0].content.parts[0].text || "Error: " + (d.error ? d.error.message : "No reply")).replace(/[*#_`]/g, "");
    hist.push({ role: "model", parts: [{ text: reply }] });
    document.getElementById("stat").textContent = loopMic ? "HANDS-FREE ACTIVE" : "READY";
    add("LEXI", reply); say(reply, voice);
  } catch (e) {
    document.getElementById("stat").textContent = "ERROR";
    add("LEXI", "Network error: " + e.message);
  }
}

function send() {
  const i = document.getElementById("inp"), v = i.value.trim();
  i.value = ""; ask(v, false);
}

function listen(follow) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { add("LEXI", "Mic not supported in this browser."); return; }
  if (!follow) loopMic = true;
  if (mic) try { mic.abort(); } catch (e) {}
  mic = new SR(); mic.lang = "en-US";
  mic.onstart = () => { document.getElementById("stage").className = "box listening"; document.getElementById("stat").textContent = "LISTENING..."; };
  mic.onresult = (e) => ask(e.results[0][0].transcript, true);
  mic.onerror = () => { document.getElementById("stage").className = "box"; if (loopMic) setTimeout(() => listen(true), 500); };
  mic.start();
}
</script>
</body>
</html>
