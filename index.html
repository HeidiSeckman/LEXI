<canvas id="rain" style="position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:0.22;"></canvas>
<script>
const PROT = "https:" + "//";
const PAIGE_ID = "yM93hbw8Qtvdma2wCnJG";
const STUDIO_HOME = PROT + "heidiseckman" + ".github.io";

const MODS = {
  m1: { name: "Legal & Tax Document Assistant", url: PROT + "legal-tax-ai-assistant-8vttj8mpyeo3dlaoxzunac" + ".streamlit.app" },
  m2: { name: "Tax-Trap Contract Scanner", url: PROT + "lexitech-tax-trap-contract-scanner-kzkf4rappq6fesyv2gy7kgs" + ".streamlit.app" },
  m3: { name: "Worst-Case Life Event Simulator", url: PROT + "lexitech-life-event-simulator-ml2f72eoad2ytnngjurwat" + ".streamlit.app" },
  m4: { name: "LexiTech Pro Cloud Workspace", url: PROT + "lexitech-workplace-jqfg2cjffckrfphhyyzrca" + ".streamlit.app" }
};

document.getElementById("backLink").href = STUDIO_HOME;
document.getElementById("linkM1").href = MODS.m1.url;
document.getElementById("linkM2").href = MODS.m2.url;
document.getElementById("linkM3").href = MODS.m3.url;
document.getElementById("linkM4").href = MODS.m4.url;

const audioPlayer = new Audio();
let chatHist = Array.of();
let handsFree = false;
let activeMic = null;

function setHolo(s, lbl) {
  const w = document.getElementById("holoWrap");
  w.classList.remove("listening", "speaking");
  if (s) w.classList.add(s);
  document.getElementById("coreState").textContent = "LEXI // " + lbl;
}

function addMsg(who, txt, url, lbl) {
  const log = document.getElementById("chatLog");
  const d = document.createElement("div");
  d.className = who === "LEXI" ? "msg msg-lexi" : (who === "SYSTEM" ? "msg msg-sys" : "msg msg-user");
  d.innerHTML = "<strong>" + who + ":</strong> " + txt;
  if (url) {
    const a = document.createElement("a");
    a.className = "launch-link"; a.href = url; a.target = "_blank"; a.rel = "noopener";
    a.textContent = "Launch " + lbl + " →";
    d.appendChild(document.createElement("br")); d.appendChild(a);
  }
  log.appendChild(d); log.scrollTop = log.scrollHeight;
}

function stopAudio() {
  audioPlayer.pause();
  audioPlayer.src = "";
  handsFree = false;
  if (activeMic) { try { activeMic.abort(); } catch (e) {} }
  setHolo("", "STANDBY");
  document.getElementById("statusText").textContent = "CONVERSATION PAUSED — TAP TALK TO RESUME";
}

async function speak(txt, autoListenNext = false) {
  audioPlayer.pause();
  const ek = localStorage.getItem("lexi_eleven_key");
  if (!ek) {
    if (autoListenNext && handsFree) startMic(true);
    return;
  }
  try {
    setHolo("speaking", "SPEAKING");
    const r = await fetch(PROT + "api.elevenlabs.io/v1/text-to-speech/" + PAIGE_ID, {
      method: "POST",
      headers: { "xi-api-key": ek, "Content-Type": "application/json" },
      body: JSON.stringify({
        text: txt,
        model_id: "eleven_multilingual_v2",
        voice_settings: { stability: 0.40, similarity_boost: 0.85, style: 0.25 }
      })
    });
    if (r.ok) {
      const blob = await r.blob();
      audioPlayer.src = URL.createObjectURL(blob);
      audioPlayer.onended = () => {
        setHolo("", "STANDBY");
        if (autoListenNext && handsFree) {
          setTimeout(() => startMic(true), 350);
        }
      };
      await audioPlayer.play();
    } else {
      const err = await r.json().catch(() => ({}));
      addMsg("SYSTEM", "ElevenLabs Voice Error: " + (err?.detail?.message || err?.detail || r.status));
      setHolo("", "STANDBY");
    }
  } catch (e) {
    addMsg("SYSTEM", "Voice Playback Error: " + e.message);
    setHolo("", "STANDBY");
  }
}

function toggleKeys() {
  document.getElementById("keyDrawer").classList.toggle("open");
  document.getElementById("gKey").value = localStorage.getItem("lexi_gemini_key") || "";
  document.getElementById("eKey").value = localStorage.getItem("lexi_eleven_key") || "";
}

function saveKeys() {
  const g = document.getElementById("gKey").value.trim(), e = document.getElementById("eKey").value.trim();
  if (g) localStorage.setItem("lexi_gemini_key", g); else localStorage.removeItem("lexi_gemini_key");
  if (e) localStorage.setItem("lexi_eleven_key", e); else localStorage.removeItem("lexi_eleven_key");
  document.getElementById("keyDrawer").classList.remove("open");
  addMsg("LEXI", "Keys saved. I am ready to talk whenever you are.");
  speak("Keys saved. I am ready to talk whenever you are.");
}

function checkNav(q) {
  const s = q.toLowerCase();
  if (!/(open|launch|go|take|show|start|load)/.test(s)) return null;
  if (/(tax|trap|scanner|02|module 2|two)/.test(s)) return MODS.m2;
  if (/(life|event|simulator|crisis|03|module 3|three)/.test(s)) return MODS.m3;
  if (/(workplace|workspace|vault|cloud|04|module 4|four)/.test(s)) return MODS.m4;
  if (/(assistant|document|audit|01|module 1|one)/.test(s)) return MODS.m1;
  return null;
}

async function handleMsg(raw, fromVoice = false) {
  const txt = (raw || "").trim();
  if (!txt) return;

  if (/^(stop|bye|goodbye|exit|end conversation|shut up)$/i.test(txt)) {
    handsFree = false;
    addMsg("YOU", txt);
    addMsg("LEXI", "Got it, ending voice chat. Just tap Talk to Lexi whenever you want to pick back up.");
    speak("Got it, ending voice chat. Just tap Talk to Lexi whenever you want to pick back up.", false);
    return;
  }

  addMsg("YOU", txt);

  const nav = checkNav(txt);
  if (nav) {
    handsFree = false;
    const msg = "Launching " + nav.name + " now.";
    addMsg("LEXI", msg, nav.url, nav.name);
    speak(msg, false);
    setTimeout(() => { window.location.href = nav.url; }, 1400);
    return;
  }

  const gk = localStorage.getItem("lexi_gemini_key");
  if (!gk) {
    addMsg("SYSTEM", "Paste your Gemini API Key (AIzaSy...) under AI & VOICE KEYS at the top right so we can have a real conversation.");
    return;
  }

  document.getElementById("statusText").textContent = "THINKING...";
  chatHist.push({ role: "user", parts: Array.of({ text: txt }) });
  if (chatHist.length > 30) chatHist = chatHist.slice(-30);

  try {
    const res = await fetch(PROT + "://googleapis.com" + encodeURIComponent(gk), {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ 
        systemInstruction: { parts: Array.of({ text: "You are Lexi, a sharp, warm, witty, and deeply intelligent conversational AI partner created by Heidi Seckman for LexiTech Legal & Tax AI Studio. Talk naturally like a real human friend and strategic collaborator—engaging, thoughtful, and perceptive. Keep your answers conversational and easy to listen to aloud (usually 2 to 4 natural sentences unless Heidi asks for deeper detail), ask natural follow-up questions to keep the conversation flowing, and never use robotic filler or markdown symbols like asterisks or bullet points since your words are spoken out loud." }) }, 
        contents: chatHist 
      })
    });
    const data = await res.json();
    if (!res.ok) {
      addMsg("SYSTEM", "Gemini API Error: " + (data?.error?.message || res.status));
      document.getElementById("statusText").textContent = "ERROR";
      return;
    }
    const rawReply = data?.candidates?.at(0)?.content?.parts?.at(0)?.text || "Sorry, I missed that—say it again?";
    const cleanReply = rawReply.replace(/[*#_`]/g, "");
    chatHist.push({ role: "model", parts: Array.of({ text: cleanReply }) });
    document.getElementById("statusText").textContent = handsFree ? "HANDS-FREE CONVERSATION ACTIVE" : "READY";
    addMsg("LEXI", cleanReply);
    speak(cleanReply, fromVoice);
  } catch (e) {
    document.getElementById("statusText").textContent = "ERROR";
    addMsg("SYSTEM", "Network Error: " + e.message);
  }
}

function sendText() {
  const inp = document.getElementById("userInput");
  const v = inp.value; inp.value = "";
  handleMsg(v, false);
}

function startMic(isFollowUp = false) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { addMsg("SYSTEM", "Voice mic not supported in this browser."); return; }
  if (!isFollowUp) handsFree = true;
  if (activeMic) { try { activeMic.abort(); } catch (e) {} }

  const r = new SR();
  activeMic = r;
  r.lang = "en-US";
  r.interimResults = false;

  r.onstart = () => {
    setHolo("listening", "LISTENING");
    document.getElementById("statusText").textContent = "LISTENING — SPEAK NATURALLY (SAY 'STOP' TO END)";
  };

  r.onresult = (e) => {
    const spoken = e.results?.item(0)?.item(0)?.transcript || "";
    if (spoken) handleMsg(spoken, true);
  };

  r.onerror = (ev) => {
    setHolo("", "STANDBY");
    if (ev.error === "no-speech" && handsFree) {
      document.getElementById("statusText").textContent = "STILL LISTENING — GO AHEAD";
      setTimeout(() => startMic(true), 400);
    } else {
      handsFree = false;
      document.getElementById("statusText").textContent = "READY — TAP TALK TO LEXI";
    }
  };

  r.onend = () => {
    if (!document.getElementById("holoWrap").classList.contains("speaking") && !handsFree) {
      setHolo("", "STANDBY");
    }
  };

  r.start();
}

(() => {
  const c = document.getElementById("rain"), x = c.getContext("2d"), ch = "01LEXI§10998332";
  let d = Array.of();
  const sz = () => { c.width = innerWidth; c.height = innerHeight; d = Array(Math.floor(c.width / 18)).fill(1); };
  sz(); addEventListener("resize", sz);
  setInterval(() => {
    x.fillStyle = "rgba(7,2,5,0.15)"; x.fillRect(0, 0, c.width, c.height); x.font = "13px monospace";
    for (let i = 0; i < d.length; i++) {
      x.fillStyle = Math.random() > 0.85 ? "#F9A8D4" : "#FF2A85";
      x.fillText(ch.charAt(Math.floor(Math.random() * ch.length)), i * 18, d.at(i) * 18);
      d.splice(i, 1, d.at(i) * 18 > c.height && Math.random() > 0.975 ? 0 : d.at(i) + 0.55);
    }
  }, 55);
})();
</script>
</body>
</html>
